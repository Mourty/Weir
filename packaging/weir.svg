      <stop offset="0" stop-color="#74d8d2"/>
      <stop offset="1" stop-color="#1d7a91"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f3f7"/>
      <stop offset="1" stop-color="#a9b2bf"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
