# Fuzzing: what reaches Weir from outside (control socket lines, imported
# settings, sound files, its own files, damaged or not, and other text)
# handed to it endlessly made up, to find what crashes it, hangs it or
# takes too much memory. Needs Rust nightly and cargo-fuzz; see README.md.
[package]
name = "weir-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
weir-protocol = { path = "../crates/protocol" }
weir-daemon = { path = "../crates/daemon" }
weir-engine = { path = "../crates/engine", features = ["fuzzing"] }
weir-record = { path = "../crates/record" }
serde_json = "1"

# Its own workspace, so the main one never builds it (it needs nightly).
[workspace]
members = ["."]

[profile.release]
debug = 1

# Weir's own code checked for arithmetic that overflows, which the release
# build lets wrap around; other people's left as Weir runs it.
[profile.release.package.weir-protocol]
overflow-checks = true
debug-assertions = true
[profile.release.package.weir-daemon]
overflow-checks = true
debug-assertions = true
[profile.release.package.weir-engine]
overflow-checks = true
debug-assertions = true
[profile.release.package.weir-record]
overflow-checks = true
debug-assertions = true

# LAME, as the main workspace builds it.
[patch.crates-io]
mp3lame-sys = { path = "../vendor/mp3lame-sys" }

[[bin]]
name = "rpc"
path = "fuzz_targets/rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import"
path = "fuzz_targets/import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sound"
path = "fuzz_targets/sound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mixer"
path = "fuzz_targets/mixer.rs"
test = false
doc = false
bench = false
