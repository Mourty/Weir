# What `make licenses` (cargo-about) gathers into THIRD-PARTY-LICENSES.txt:
# the licenses of every library built into Weir's programs. Build tools and
# test-only libraries are left out, since no part of them ships.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "CC0-1.0",
    # Mozilla's list of trusted certificate authorities (webpki-roots),
    # which comes with the HTTPS library the update check uses.
    "CDLA-Permissive-2.0",
    "ISC",
    # The MP3 encoder's bindings (mp3lame-encoder). LAME itself, built in
    # from vendor/mp3lame-sys, is LGPL too: its license goes with Weir as
    # LAME-COPYING.txt. Weir's source is open, so LAME can be swapped.
    "LGPL-3.0",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }
