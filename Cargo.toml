[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/engine",
    "crates/daemon",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Mourty/Weir"
# Weir ships as programs, not as libraries on crates.io.
publish = false

[workspace.dependencies]
weir-protocol = { path = "crates/protocol" }
weir-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
pipewire = { version = "0.10", features = ["v0_3_77"] }
libspa = "0.10"
libspa-sys = "0.10"
pipewire-sys = "0.10"
eframe = { version = "0.33", features = ["persistence"] }
egui = "0.33"
dirs = "6"
ksni = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
