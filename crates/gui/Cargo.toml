[package]
name = "weir"
description = "Weir mixer window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "weir"
path = "src/main.rs"

[dependencies]
weir-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe.workspace = true
egui.workspace = true
dirs.workspace = true
toml.workspace = true
# Already built for egui's accessibility support; used here to ask the
# desktop portal for the light or dark preference.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
