# The checks every change must pass, run on each push to main and on each
# pull request: formatting, clippy, the tests, a build with the oldest Rust
# Weir supports, and license notices that match the dependencies.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libpipewire-0.3-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: Builds with Rust 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libpipewire-0.3-dev
      # rust-version in Cargo.toml. Distributions such as Ubuntu 24.04 offer
      # this version and not much newer, so a dependency update that needs
      # more should be a decision, not an accident.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 build --workspace --locked

  licenses:
    name: License notices are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Regenerate THIRD-PARTY-LICENSES.txt and compare
        run: |
          make licenses
          git diff --exit-code packaging/licenses/THIRD-PARTY-LICENSES.txt || {
            echo "::error::THIRD-PARTY-LICENSES.txt is out of date. Run 'make licenses' and commit it."
            exit 1
          }
