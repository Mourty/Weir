# The checks every change must pass, run on each push to main and on each
# pull request: formatting, clippy, the tests, a build with the oldest Rust
# Weir supports, and license notices that cover the dependencies' licenses.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config libpipewire-0.3-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The same build and tests on a 64-bit ARM computer (a Raspberry Pi 5,
  # an Apple Silicon Mac running Linux, an ARM laptop), which the packages
  # are also built for. GitHub's ARM runners are free for public
  # repositories.
  arm64:
    name: Tests on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config libpipewire-0.3-dev
      # The ARM image may come without rustup; install it if so.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: Builds with Rust 1.95
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config libpipewire-0.3-dev
      # rust-version in Cargo.toml, the oldest egui supports, so a
      # dependency update that needs more should be a decision, not an
      # accident.
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.95 build --workspace --locked

  licenses:
    name: License notices are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      # A license that packaging/licenses/about.toml does not accept fails
      # `make licenses` itself. So does a change in which licenses Weir's
      # libraries come under, for someone to look at before it ships. New
      # versions and new libraries under the same licenses only leave a
      # note: the file is brought up to date in each release's pull
      # request, where it must match.
      - name: Regenerate THIRD-PARTY-LICENSES.txt and compare
        env:
          BASE: ${{ github.base_ref }}
        run: |
          file=packaging/licenses/THIRD-PARTY-LICENSES.txt
          cp "$file" "$RUNNER_TEMP/before.txt"
          make licenses
          kinds() { sed -n 's/^\(.*\): [0-9]* librar\(y\|ies\)$/\1/p' "$1" | sort; }
          if ! diff <(kinds "$RUNNER_TEMP/before.txt") <(kinds "$file") > "$RUNNER_TEMP/kinds.diff"; then
            echo "The licenses Weir's libraries come under changed (> new, < gone):"
            cat "$RUNNER_TEMP/kinds.diff"
            echo "::error::The licenses of Weir's libraries changed. Check that they suit Weir, then run 'make licenses' and commit THIRD-PARTY-LICENSES.txt."
            exit 1
          fi
          git diff --quiet "$file" && exit 0
          release=false
          if [ -n "$BASE" ]; then
            git fetch --quiet --depth=1 origin "$BASE"
            version() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
            [ "$(git show FETCH_HEAD:Cargo.toml | version)" != "$(version < Cargo.toml)" ] && release=true
          fi
          if $release; then
            echo "::error::This pull request makes a release, so THIRD-PARTY-LICENSES.txt must be current. Run 'make licenses' and commit it."
            exit 1
          fi
          echo "::notice::THIRD-PARTY-LICENSES.txt lists older versions or misses new libraries under the same licenses. The release brings it up to date."
