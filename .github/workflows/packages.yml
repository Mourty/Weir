# Builds Weir's packages: an RPM for Fedora and Nobara, a .deb for
# Ubuntu, Linux Mint, Pop!_OS and Debian, and an AppImage for any other
# distribution, each for x86_64 and for 64-bit ARM, and a package for Arch
# Linux and the systems built on it (x86_64 only), whose recipe also goes
# to the AUR.
#
# * Publishing a release on GitHub builds them and attaches them to the
#   release, with a SHA256SUMS file. GitHub also signs a record that this
#   workflow built them from the release's commit (an attestation), which
#   `gh attestation verify` checks. The Arch package's recipe is published
#   to the AUR.
# * A pull request that changes the packaging builds them as a test.
# * "Run workflow" on the Actions tab builds them on demand. Ticking its
#   AUR box publishes the current version's release to the AUR again, for
#   a first upload or after a change to the PKGBUILD alone.
#
# The last two keep the packages as downloads on the run's own page, for
# trying them before a release.

name: Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      aur:
        description: Publish the current version's release to the AUR
        type: boolean
        default: false
  pull_request:
    paths:
      - Makefile
      - Cargo.toml
      - Cargo.lock
      - packaging/**
      - .github/workflows/packages.yml

permissions:
  contents: read

jobs:
  version:
    name: Version numbers agree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Compare Cargo.toml, the RPM spec, AppStream and the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          fail() { echo "::error::$1"; exit 1; }
          spec=$(sed -n 's/^Version:[[:space:]]*//p' packaging/weir.spec)
          [ "$spec" = "$version" ] ||
            fail "Cargo.toml says $version but packaging/weir.spec says $spec."
          grep -q -- "- $version-" packaging/weir.spec ||
            fail "packaging/weir.spec has no %changelog entry for $version."
          grep -q "<release version=\"$version\"" packaging/io.github.mourty.weir.metainfo.xml ||
            fail "packaging/io.github.mourty.weir.metainfo.xml has no <release> for $version."
          if [ "${{ github.event_name }}" = release ]; then
            tag="${{ github.event.release.tag_name }}"
            [ "$tag" = "v$version" ] ||
              fail "The release's tag is $tag, but Cargo.toml says $version, so it should be v$version."
          fi

  rpm:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RPM (Fedora, Nobara)
            runner: ubuntu-24.04
            arch: x86_64
          - name: RPM (Fedora, Nobara), arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Like the .deb, built on the oldest release it is for, so it installs
    # on newer ones too.
    container: fedora:44
    steps:
      # git before checkout, so the checkout is a real repository:
      # `make rpm` packages the last commit with `git archive`.
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git-core make rpm-build cargo rust clang cmake pipewire-devel \
            pkgconf-pkg-config desktop-file-utils libappstream-glib
      - uses: actions/checkout@v4
      # The RPM is copied out of its architecture folder: upload-artifact
      # keeps any folders after a wildcard, and the release job needs the
      # packages side by side.
      - name: Build the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make rpm RPM_RELEASE=1 RPMTOP="$GITHUB_WORKSPACE/rpmbuild"
          mkdir -p dist
          cp rpmbuild/RPMS/*/weir-*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  deb:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: .deb (Ubuntu, Mint, Pop!_OS, Debian)
            runner: ubuntu-24.04
            arch: amd64
          - name: .deb (Ubuntu, Mint, Pop!_OS, Debian), arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    # The oldest system the package is for. Built here, it asks for no
    # newer libraries than Ubuntu 24.04 has, so it installs on the newer
    # ones too.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config libpipewire-0.3-dev dpkg-dev desktop-file-utils appstream
      # The ARM image may come without rustup; install it if so.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the package
        run: make deb
      - name: Check the package
        run: |
          dpkg-deb --info target/deb/*.deb
          root=target/deb/root
          desktop-file-validate $root/usr/share/applications/weir.desktop
          appstreamcli validate --no-net $root/usr/share/metainfo/io.github.mourty.weir.metainfo.xml
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppImage
            runner: ubuntu-24.04
            arch: x86_64
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - name: AppImage, arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    # Built on the oldest system it is for, like the .deb: it needs the C
    # library of Ubuntu 24.04 or newer, and PipeWire's from the system.
    runs-on: ${{ matrix.runner }}
    env:
      # Pinned, by version here and by checksum in the matrix:
      # appimagetool packs the AppImage, and the runtime is the small
      # program at its front that mounts and starts it, in every copy
      # people download. A version changes both checksums.
      APPIMAGETOOL_VERSION: "1.9.1"
      RUNTIME_VERSION: "20251108"
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config libpipewire-0.3-dev desktop-file-utils appstream \
            squashfs-tools zsync
      # The ARM image may come without rustup; install it if so.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Fetch appimagetool and the AppImage runtime
        run: |
          mkdir -p tools
          base=https://github.com/AppImage
          curl -fsSL -o tools/appimagetool \
            "$base/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL -o tools/runtime \
            "$base/type2-runtime/releases/download/$RUNTIME_VERSION/runtime-${{ matrix.arch }}"
          sha256sum -c <<EOF
          ${{ matrix.appimagetool_sha256 }}  tools/appimagetool
          ${{ matrix.runtime_sha256 }}  tools/runtime
          EOF
          chmod +x tools/appimagetool
      # The runner may have no FUSE, so appimagetool unpacks itself to run.
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: make appimage APPIMAGETOOL="$PWD/tools/appimagetool" APPIMAGE_RUNTIME=tools/runtime
      - name: Check the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cd target/appimage
          ls -la
          desktop-file-validate AppDir/weir.desktop
          appstreamcli validate --no-net AppDir/usr/share/metainfo/io.github.mourty.weir.metainfo.xml
          image=$(ls Weir-*-${{ matrix.arch }}.AppImage)
          test -s "$image.zsync"
          # It starts, and runs the program asked for.
          "./$image" weirctl --version
          "./$image" weir-daemon --version
          # Where updaters look for the next version. The runtime reads
          # this without mounting, but only when not told to unpack itself.
          env -u APPIMAGE_EXTRACT_AND_RUN "./$image" --appimage-updateinformation | tee update-info
          grep -q "^gh-releases-zsync|Mourty|Weir|latest|Weir-\*-${{ matrix.arch }}.AppImage.zsync$" update-info
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            target/appimage/Weir-*.AppImage
            target/appimage/Weir-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 14

  arch:
    name: Arch Linux
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      # git before checkout, so the checkout is a real repository: pull
      # requests build their own code, packed with `git archive`.
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh pacman-contrib namcap
      - uses: actions/checkout@v4
      - id: prep
        name: Prepare the PKGBUILD
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # A release, or "Run workflow" with the AUR box ticked, builds the
          # release's source as GitHub serves it, which is what AUR users
          # download. Anything else builds this checkout instead.
          RELEASE: ${{ github.event_name == 'release' || inputs.aur == true }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # makepkg refuses to run as root. It uses sudo to install the
          # PKGBUILD's dependencies, which also checks that they are enough.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          dir=/home/builder/weir
          mkdir "$dir"
          sed "s/^pkgver=.*/pkgver=$VERSION/" packaging/aur/PKGBUILD > "$dir/PKGBUILD"
          if [ "$RELEASE" != true ]; then
            tarball="$dir/weir-$VERSION.tar.gz"
            git archive --format=tar.gz --prefix="Weir-$VERSION/" -o "$tarball" HEAD
            sum=$(sha256sum "$tarball" | cut -d' ' -f1)
            sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" "$dir/PKGBUILD"
          fi
          chown -R builder: "$dir"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
      - name: Fill in the checksum of the release's source
        if: steps.prep.outputs.release == 'true'
        run: su builder -c 'cd /home/builder/weir && updpkgsums'
      - name: Build and test the package
        run: su builder -c 'cd /home/builder/weir && makepkg --syncdeps --noconfirm'
      # namcap is Arch's packaging linter. Its findings are advice to read
      # in the log, some of them wrong for Rust programs, so they do not
      # fail the job. .SRCINFO is the PKGBUILD's summary the AUR reads.
      - name: Check the package and write .SRCINFO
        run: |
          cd /home/builder/weir
          su builder -c 'namcap PKGBUILD weir-*.pkg.tar.zst' || true
          su builder -c 'makepkg --printsrcinfo > .SRCINFO'
          cat .SRCINFO
      # The package, for the release page. The pattern leaves out the
      # weir-debug package that makepkg's debug option may add.
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: /home/builder/weir/weir-[0-9]*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
      # The recipe, for the AUR.
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: |
            /home/builder/weir/PKGBUILD
            /home/builder/weir/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Its own job, so that a problem with the AUR never holds up the
  # release page.
  aur:
    name: Publish to the AUR
    if: github.event_name == 'release' || inputs.aur == true
    needs: arch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: recipe
      # Needs the AUR_SSH_KEY secret: the private half of an SSH key whose
      # public half is on the maintainer's AUR account. CONTRIBUTING.md
      # says how to make one.
      - name: Push the recipe to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::warning::The AUR was not updated: there is no AUR_SSH_KEY secret. See CONTRIBUTING.md."
            exit 0
          fi
          keys=$(mktemp -d)
          printf '%s\n' "$AUR_SSH_KEY" > "$keys/aur"
          chmod 600 "$keys/aur"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$keys/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $keys/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$keys/known_hosts"
          git clone ssh://aur@aur.archlinux.org/weir.git aur
          cp recipe/PKGBUILD recipe/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this PKGBUILD."
            exit 0
          fi
          version=$(sed -n 's/^\tpkgver = //p' .SRCINFO)-$(sed -n 's/^\tpkgrel = //p' .SRCINFO)
          git -c user.name=Mourty -c user.email=Mourt2@proton.me \
            commit -m "Update to $version"
          git push origin HEAD:master

  publish:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: [rpm, deb, appimage, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the files to the release
      id-token: write # get a signing certificate for the attestation
      attestations: write # store the attestation with the repository
    steps:
      # By name: the AUR recipe is not for the release page.
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: dist
      # The .zsync files are for updaters, which check what they download
      # against them; they are attached but not listed.
      - name: Write checksums
        run: cd dist && sha256sum -- *.rpm *.deb *.AppImage *.pkg.tar.zst > SHA256SUMS && cat SHA256SUMS
      # Signed in the same run that built the packages, so it vouches for
      # exactly these files; a file swapped on the release later fails the
      # check. Attestations need a public repository (or GitHub Enterprise).
      - name: Sign a record of how the packages were built
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage
            dist/*.pkg.tar.zst
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "${{ github.repository }}" --clobber
